const makePdfBlob=async(sel)=>{if(!window.jspdf||!window.html2canvas)throw new Error('No están disponibles las librerías PDF');const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),pages=[...document.querySelectorAll(sel)];pdf.deletePage(1);if(!pages.length)throw new Error('No se encontró el documento');const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1;';document.body.appendChild(host);try{for(const node of pages){const clone=node.cloneNode(true);clone.style.width='794px';clone.style.maxWidth='none';clone.style.boxSizing='border-box';clone.style.margin='0';host.appendChild(clone);for(const im of clone.querySelectorAll('img')){if(!im.complete)await new Promise(r=>{im.onload=r;im.onerror=r});}const c=await html2canvas(clone,{scale:2,backgroundColor:'#fff',width:794,windowWidth:794,useCORS:true}),pxPerMm=c.width/190,pagePx=Math.floor(277*pxPerMm);let y=0;while(y<c.height){const h=Math.min(pagePx,c.height-y),part=document.createElement('canvas');part.width=c.width;part.height=h;part.getContext('2d').drawImage(c,0,y,c.width,h,0,0,c.width,h);if(pdf.getNumberOfPages()>0)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',.94),'JPEG',10,10,190,h/pxPerMm);y+=h;}host.removeChild(clone);}return pdf.output('blob')}finally{host.remove()}};
